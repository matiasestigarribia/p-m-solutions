<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ project_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Empresa de tecnologia focada no desenvolvimento de sistemas, soluções digitais, automações e processos personalizados para empresas.{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', path='css/pm.css') }}" rel="stylesheet">

  <!-- HTMX: fragment navigation. Every nav link falls back to a normal href
       when JavaScript is unavailable, so the site works without it. -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="site-grid" aria-hidden="true"></div>
  <a class="skip-link" href="#content">Pular para o conteúdo</a>

  <nav class="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="/" aria-label="P & M Solutions"
         hx-get="/" hx-target="#content" hx-swap="innerHTML" hx-push-url="true">
        <span class="nav__brand-crop">
          <img class="nav__brand-logo"
               src="{{ url_for('static', path='brand/pm-solutions-logo-dark.png') }}"
               alt="P & M Solutions">
        </span>
      </a>
      <button class="nav__toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-links" data-nav-toggle>&#9776;</button>
      <ul class="nav__links" id="nav-links">
        <li><a href="/quem-somos"
               hx-get="/quem-somos" hx-target="#content" hx-swap="innerHTML" hx-push-url="true">Quem Somos</a></li>
        <li><a href="/produtos"
               hx-get="/produtos" hx-target="#content" hx-swap="innerHTML" hx-push-url="true">Produtos</a></li>
        <li><a href="/contato"
               hx-get="/contato" hx-target="#content" hx-swap="innerHTML" hx-push-url="true">Contato</a></li>
      </ul>
    </div>
  </nav>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>&copy; {{ year }} {{ project_name }}</span>
      <span>Feito com tecnologia • FastAPI</span>
    </div>
  </footer>

  <script src="{{ url_for('static', path='js/main.js') }}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
