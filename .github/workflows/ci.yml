name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint, compile & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies (dev extras)
        run: uv sync --frozen --extra dev

      - name: Ruff — lint (correctness rules; broader style modernisation deferred)
        # E4/E7/E9 catch import errors, indentation/statement errors, and
        # runtime syntax errors. F covers pyflakes (undefined names, unused
        # imports, etc.). UP/RUF/ISC/SIM style modernisation is deferred.
        run: uv run ruff check . --select E4,E7,E9,F

      - name: Compile Python sources
        run: uv run python -m compileall app/ -q

      - name: Check for whitespace / merge-conflict markers
        run: git diff --check HEAD

      - name: Pytest
        env:
          # CI has no Neon or R2 credentials — enable_database defaults to
          # False and the suite uses the sqlite contact-sink fixture, so no
          # secrets are required.
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-used-in-production
          PROJECT_NAME: "P & M Solutions"
        run: uv run pytest -v
