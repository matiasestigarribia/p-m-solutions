[project]
name = "p-m-solutions"
version = "0.2.0"
description = "P & M Solutions — MVP public content site with Neon DB, R2 storage, and admin panel."
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    # Database (Neon / PostgreSQL)
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Admin panel
    "sqladmin>=0.19",
    "PyJWT>=2.8",
    "pwdlib[argon2]>=0.2",
    # Object storage (Cloudflare R2 via S3-compatible API)
    "boto3>=1.34",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Stage 3 (chatbot) — absent from MVP; kept for documentation only.
stage3-chatbot = [
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-groq>=0.1",
    "langchain-community>=0.2",
    "langchain-text-splitters>=0.2",
    "langchain-postgres>=0.0.9",
    "pypdf>=4.2",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "anyio>=4.4",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
