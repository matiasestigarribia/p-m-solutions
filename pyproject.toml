[project]
name = "p-m-solutions"
version = "0.1.0"
description = "P & M Solutions — public content site and contact form (Stage 1)."
requires-python = ">=3.11"

# Stage 1 runtime: content site + contact form only. No Neon, no Cloudflare R2,
# no chatbot/LLM. The base install must stay light enough to boot with an empty
# environment.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Deferred integrations — NOT installed in Stage 1. Kept here so the future
# architecture is documented and installable on demand, without bloating the
# base image or forcing the credentials/services to exist.
stage2-database = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector<0.4",
]
stage2-storage = [
    "boto3>=1.34",
    "pillow>=10.3",
]
stage3-chatbot = [
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-groq>=0.1",
    "langchain-community>=0.2",
    "langchain-text-splitters>=0.2",
    "langchain-postgres>=0.0.9",
    "pypdf>=4.2",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "anyio>=4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
